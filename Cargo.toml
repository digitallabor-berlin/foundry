[workspace]
resolver = "2"
members = [
    "crates/foundry-core",
    "crates/foundry",
    "crates/foundry-sd-jwt-vc",
    "crates/foundry-mdoc",
    "crates/foundry-issuer",
    "crates/foundry-verifier",
]

[workspace.package]
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Digital Labor Berlin"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
async-trait = "0.1"
josekit = "0.10"
openssl = "0.10"
x509-cert = { version = "0.3", features = ["pem"] }
base64 = "0.22"
rcgen = { version = "0.14", features = ["x509-parser"] }
coset = "0.3"
ciborium = "0.2"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
percent-encoding = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
flate2 = "1"
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6", features = ["axum"] }

# Strip debug info from third-party dependencies in dev/test builds.
# Most of the debug-info bloat (and the linker time it costs) comes from
# large dependency graphs (openssl-sys, sqlx, tokio, rustls, ...), not from
# our own crates. Workspace crates keep full debug info (no override here),
# so `cargo test`/`cargo build` still give useful backtraces and line info
# for foundry's own code, while dependency debug info is dropped to speed
# up compilation and linking of test binaries.
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
