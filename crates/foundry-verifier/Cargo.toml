[package]
name = "foundry-verifier"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
foundry-core = { path = "../foundry-core" }
foundry-sd-jwt-vc = { path = "../foundry-sd-jwt-vc" }
foundry-mdoc = { path = "../foundry-mdoc" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
josekit = { workspace = true }
utoipa = { workspace = true }
uuid = { version = "1", features = ["v4"] }
percent-encoding = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = { workspace = true }
# Signs the exact webhook body bytes in webhook.rs.
hmac = { workspace = true }
# Only for the sensitive-gated SessionTranscript trace diagnostic in verify.rs,
# and the hex encoding of the webhook HMAC.
hex = { workspace = true }

[dev-dependencies]
# Test code names ciborium::Value for the mdoc SessionTranscript.
ciborium = { workspace = true }
# Only for the capture layer that proves the sensitive-gated SessionTranscript
# diagnostic is emitted even when issuer trust fails (root AGENTS.md §4.5).
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
tempfile = "3"
coset = { workspace = true }
