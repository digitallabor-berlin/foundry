# Example foundry-wallet configuration.
#
# This is wired to match the dev environment produced by `foundry quickstart`
# (run from the same directory as this file) followed by `foundry serve
# --config config.yaml`:
#   - admin API listens on 127.0.0.1:9000 with api_key "dev-admin-key"
#   - wallet-facing API listens on 8443 (plain HTTP, despite config.yaml's
#     public_base_url saying "https://localhost:8443" -- that's only used to
#     construct issuer/verifier metadata URLs, the actual listener has no TLS)
#   - the dev PKI root CA quickstart generates is at ./trust/root.pem
#   - quickstart's default credential_types entry is "pid" (vct
#     https://localhost:8443/vct/pid, claims given_name + birthdate)
#
# Usage:
#   cargo run -p foundry-wallet -- --config wallet.yaml tui
#   cargo run -p foundry-wallet -- --config wallet.yaml issue --preset pid
#   cargo run -p foundry-wallet -- --config wallet.yaml verify --preset pid_request --consent accept
#
# See README.md's "Debug Wallet CLI/TUI" section and
# docs/superpowers/specs/2026-07-24-foundry-wallet-cli-design.md for the full
# configuration reference.

# Where credentials, keys, certs, and the event log are stored as plain files
# for inspection. Created automatically on first use if it doesn't exist.
data_dir: ./wallet-data

endpoints:
  # foundry's admin listener -- used to create credential offers and
  # verification requests via presets below.
  admin_base_url: http://127.0.0.1:9000
  # foundry's wallet-facing listener -- used for the actual OpenID4VCI
  # /token, /nonce, /credential exchange and OpenID4VP response submission.
  wallet_base_url: http://localhost:8443
  # Matches quickstart's generated admin.api_key. Prefer admin_api_key_env
  # (e.g. FOUNDRY_ADMIN_API_KEY) instead of an inline key outside of local dev.
  admin_api_key: dev-admin-key

trust:
  # Real X.509 trust validation, applied to both the issuer's credential-
  # signing JWT (issuance) and the verifier's signed request object
  # (verification). Set to `disabled` to skip validation entirely (a warning
  # is logged and the flow proceeds anyway) -- useful when deliberately
  # debugging an untrusted issuer/verifier.
  validation: enabled
  anchors:
    # quickstart writes its self-signed dev root CA here.
    - certs: ./trust/root.pem

# Named issuance presets: pick one with `issue --preset <name>` to create a
# credential offer via the admin API and immediately consume it, instead of
# consuming an externally-provided offer deep link (`issue --offer-uri ...`).
issuance_presets:
  pid:
    credential_type_id: pid
    claims:
      given_name: Alice
      birthdate: "1990-01-01"
    tx_code_required: false

# Named verification presets: pick one with `verify --preset <name>` to
# create a verification request via the admin API and immediately respond to
# it, instead of consuming an externally-provided request deep link
# (`verify --request-uri ...`).
verification_presets:
  pid_request:
    dcql_query:
      credentials:
        - id: c1
          format: dc+sd-jwt
          meta:
            vct_values: ["https://localhost:8443/vct/pid"]
          claims:
            - path: ["given_name"]
            - path: ["birthdate"]
    transport: request_uri